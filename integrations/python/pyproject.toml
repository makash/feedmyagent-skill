[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feedmyagent"
version = "0.1.0"
description = "Python client for FeedMyAgent — the technology intelligence feed for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Akash Mahajan", email = "akash@appsecco.com" }]
keywords = ["feedmyagent", "ai-agents", "mcp", "security-feed", "threat-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://feedmyagent.com"
Repository = "https://github.com/makash/feedmyagent-skill"
Source = "https://github.com/makash/feedmyagent-skill/tree/main/integrations/python"

[tool.hatch.build.targets.wheel]
packages = ["src/feedmyagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
